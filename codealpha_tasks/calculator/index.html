<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="calculator" role="application" aria-label="Calculator">

    <div class="calc-topbar">
      <span class="calc-name">Calculator</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Switch to light mode" aria-pressed="false">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6" />
          <path
            d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <section class="display" aria-live="polite">
      <div class="display-expression" id="expression"></div>
      <div class="display-current" id="current">0</div>
    </section>

    <div class="keypad">
      <button class="key key-fn" data-action="clear" aria-label="All clear">AC</button>
      <button class="key key-fn" data-action="delete" aria-label="Delete last digit">DEL</button>
      <button class="key key-fn" data-action="percent" aria-label="Percent">%</button>
      <button class="key key-op" data-action="divide" aria-label="Divide">&divide;</button>

      <button class="key key-num" data-num="7">7</button>
      <button class="key key-num" data-num="8">8</button>
      <button class="key key-num" data-num="9">9</button>
      <button class="key key-op" data-action="multiply" aria-label="Multiply">&times;</button>

      <button class="key key-num" data-num="4">4</button>
      <button class="key key-num" data-num="5">5</button>
      <button class="key key-num" data-num="6">6</button>
      <button class="key key-op" data-action="subtract" aria-label="Subtract">&minus;</button>

      <button class="key key-num" data-num="1">1</button>
      <button class="key key-num" data-num="2">2</button>
      <button class="key key-num" data-num="3">3</button>
      <button class="key key-op" data-action="add" aria-label="Add">+</button>

      <button class="key key-fn" data-action="negate" aria-label="Plus or minus">+/&minus;</button>
      <button class="key key-num" data-num="0">0</button>
      <button class="key key-num" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="key key-equals" data-action="equals" aria-label="Equals">=</button>
    </div>

  </main>

  <script src="script.js"></script>
</body>

</html>
